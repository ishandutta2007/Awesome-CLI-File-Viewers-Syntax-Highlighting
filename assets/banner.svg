<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#080b14"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="tealGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".35"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient><linearGradient id="borderGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".6"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".2"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".5"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".7" d="M 30 0 L 0 0 0 30"/></pattern><filter id="blurFilter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur stdDeviation="40"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(-20px,15px);opacity:.6}}@keyframes pulseOrb2{0%{transform:scale(1) translate(0,0);opacity:.3}50%{transform:scale(1.2) translate(25px,-15px);opacity:.55}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes floatPillReverse{0%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes scanline{0%{transform:translateY(-100%)}}.orb-1{animation:pulseOrb 7s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb2 8s ease-in-out infinite;transform-origin:1000px 260px}.pill-anim-1{animation:floatPill 4.5s ease-in-out infinite}.pill-anim-2{animation:floatPillReverse 5s ease-in-out infinite}.pill-anim-3{animation:floatPill 4.8s ease-in-out infinite}</style><rect width="100%" height="100%" fill="url(#bgGrad)" rx="12"/><rect width="100%" height="100%" fill="url(#grid)" rx="12"/><circle cx="220" cy="110" r="140" fill="url(#glowGrad)" class="orb-1" filter="url(#blurFilter)"/><circle cx="980" cy="240" r="160" fill="url(#glowGrad)" class="orb-2" filter="url(#blurFilter)"/><rect width="1197" height="357" x="1.5" y="1.5" fill="none" stroke="url(#borderGrad)" stroke-width="2" rx="11"/><g opacity=".45" transform="translate(100, 20)"><rect width="1000" height="320" fill="#0f172a" fill-opacity=".3" stroke="#1e293b" stroke-width="1" rx="8"/><circle cx="22" cy="18" r="5" fill="#ef4444"/><circle cx="38" cy="18" r="5" fill="#f59e0b"/><circle cx="54" cy="18" r="5" fill="#10b981"/><text x="80" y="22" fill="#64748b" font-family="monospace" font-size="12">terminal — bat | glow | fzf | delta | eza | yazi</text></g><g transform="translate(470, 68)"><rect width="260" height="28" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" rx="14"/><circle cx="16" cy="14" r="4" fill="#38bdf8"/><text x="30" y="19" fill="#c7d2fe" font-size="12" font-weight="600" letter-spacing=".5">CLI UTILITIES &amp; SYNTAX VIEWERS</text></g><text x="600" y="148" fill="url(#textGrad)" font-size="44" font-weight="900" letter-spacing="-1" text-anchor="middle">Awesome CLI File Viewers</text><text x="600" y="194" fill="#fff" font-size="28" font-weight="700" letter-spacing="-.5" text-anchor="middle">&amp; Syntax Highlighting Tools</text><text x="600" y="235" fill="#94a3b8" font-size="16" font-weight="400" text-anchor="middle">Curated ecosystem of terminal pagers, AST diff viewers, syntax renderers &amp; cloud shells</text><g class="pill-anim-1" transform="translate(170, 280)"><rect width="180" height="36" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity=".95" rx="18"/><text x="90" y="23" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">⚡ Fast Rust &amp; Go CLI</text></g><g class="pill-anim-2" transform="translate(380, 280)"><rect width="210" height="36" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity=".95" rx="18"/><text x="105" y="23" fill="#c084fc" font-size="13" font-weight="700" text-anchor="middle">🎨 TextMate &amp; Tree-sitter</text></g><g class="pill-anim-3" transform="translate(620, 280)"><rect width="210" height="36" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.2" opacity=".95" rx="18"/><text x="105" y="23" fill="#2dd4bf" font-size="13" font-weight="700" text-anchor="middle">🔍 Fuzzy Search &amp; Diffing</text></g><g class="pill-anim-1" transform="translate(860, 280)"><rect width="170" height="36" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" opacity=".95" rx="18"/><text x="85" y="23" fill="#fb7185" font-size="13" font-weight="700" text-anchor="middle">☁️ Cloud Shell &amp; CDEs</text></g></svg>